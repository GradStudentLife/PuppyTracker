<script>
const KEY='puppyTrackerEventsV2';
const CATKEY='puppyTrackerCatsV2';
const SETKEY='puppyTrackerSettingsV2';
const TRENDKEY='puppyTrackerTrendsV2';
const BACKUPKEY='puppyTrackerOriginalBackupV1';
const MIGRATIONKEY='puppyTrackerMigrationCompleteV2';

const OLD_KEYS={
  events:['puppyTrackerEvents','puppyEvents','events','puppy_tracker_events'],
  cats:['puppyTrackerCategories','puppyTrackerCats','categories','puppy_categories'],
  settings:['puppyTrackerSettings','settings','puppy_settings'],
  trends:['puppyTrackerTrends','trends']
};

function readJSONKey(key){
  try{
    const raw=localStorage.getItem(key);
    return raw?JSON.parse(raw):null;
  }catch(e){return null;}
}

function findOldData(keys){
  for(const k of keys){
    const v=readJSONKey(k);
    if(v!==null)return {key:k,value:v};
  }
  return null;
}

function looksLikeEventArray(v){
  return Array.isArray(v)&&v.some(e=>e&&(
    'time' in e || 'start' in e || 'timestamp' in e ||
    'name' in e || 'category' in e || 'categoryId' in e
  ));
}

function normalizeOldEvent(e,index){
  const categoryName=e.categoryName||e.category||e.name||e.type||e.eventName||'Unknown';
  let categoryId=e.categoryId||e.category_id||null;
  let kind=e.kind||e.type||e.eventType||null;

  if(kind==='one-time')kind='instant';
  if(kind==='one_time')kind='instant';
  if(kind==='duration')kind='timed';

  const start=e.start||e.startTime||null;
  const end=e.end||e.endTime||null;
  const time=e.time||e.timestamp||e.dateTime||e.datetime||start||new Date().toISOString();

  if(!kind){
    kind=(start||end)?'timed':'instant';
  }

  return {
    id:e.id||crypto.randomUUID(),
    categoryId:categoryId,
    legacyCategoryName:categoryName,
    kind,
    time:new Date(time).toString()!=='Invalid Date'?new Date(time).toISOString():new Date().toISOString(),
    start:start&&new Date(start).toString()!=='Invalid Date'?new Date(start).toISOString():null,
    end:end&&new Date(end).toString()!=='Invalid Date'?new Date(end).toISOString():null,
    qty:e.qty??e.quantity??e.amount??null,
    notes:e.notes??e.note??''
  };
}

/*
IMPORTANT MIGRATION FIX

The old version of the app was checking the old storage keys every time
the app loaded. That meant:

1. Old data was imported.
2. You deleted something.
3. The app loaded again.
4. It saw the old data still sitting in the old storage key.
5. It imported it again.

This flag makes migration a ONE-TIME operation.

The original old storage is intentionally NOT deleted because we want
the backup/recovery system to remain available.
*/
function migrateOldStorage(){

  const migrationComplete=localStorage.getItem(MIGRATIONKEY)==='true';

  /*
  If migration has already happened, NEVER look at the old storage again.
  This is what makes deleted historical events stay deleted.
  */
  if(migrationComplete)return;

  const currentEvents=readJSONKey(KEY);
  const currentCats=readJSONKey(CATKEY);
  const currentSettings=readJSONKey(SETKEY);
  const currentTrends=readJSONKey(TRENDKEY);

  /*
  First make one permanent backup of whatever old data exists.
  This backup is independent from the live app data.
  */
  if(!localStorage.getItem(BACKUPKEY)){
    const backup={};
    let found=false;

    for(const group of Object.keys(OLD_KEYS)){
      const hit=findOldData(OLD_KEYS[group]);

      if(hit){
        backup[group]={
          key:hit.key,
          value:hit.value
        };
        found=true;
      }
    }

    if(found){
      localStorage.setItem(
        BACKUPKEY,
        JSON.stringify({
          created:new Date().toISOString(),
          data:backup
        })
      );
    }
  }

  /*
  EVENTS

  Only import old events if the new V2 event storage does not already
  contain data.
  */
  if(currentEvents===null){
    const hit=findOldData(OLD_KEYS.events);

    if(hit){
      let source=hit.value;

      if(source&&Array.isArray(source.events)){
        source=source.events;
      }

      if(looksLikeEventArray(source)){
        localStorage.setItem(
          KEY,
          JSON.stringify(source.map(normalizeOldEvent))
        );
      }else{
        localStorage.setItem(KEY,'[]');
      }
    }else{
      localStorage.setItem(KEY,'[]');
    }
  }

  /*
  CATEGORIES
  */
  if(currentCats===null){
    const hit=findOldData(OLD_KEYS.cats);

    if(hit){
      let source=hit.value;

      if(source&&Array.isArray(source.categories)){
        source=source.categories;
      }

      if(Array.isArray(source)&&source.length){
        const converted=source.map((c,i)=>({
          id:c.id||c.categoryId||crypto.randomUUID(),
          name:c.name||c.label||c.title||('Category '+(i+1)),
          icon:c.icon||c.emoji||'🐾',
          kind:c.kind||c.type||'instant',
          notesRequired:c.notesRequired??c.requireNotes??true,
          quantityEnabled:c.quantityEnabled??c.hasQuantity??(c.kind==='quantity'),
          quantityLabel:c.quantityLabel||c.unit||'Amount'
        }));

        localStorage.setItem(
          CATKEY,
          JSON.stringify(converted)
        );
      }
    }
  }

  /*
  SETTINGS
  */
  if(currentSettings===null){
    const hit=findOldData(OLD_KEYS.settings);

    if(hit){
      localStorage.setItem(
        SETKEY,
        JSON.stringify(hit.value)
      );
    }
  }

  /*
  TRENDS
  */
  if(currentTrends===null){
    const hit=findOldData(OLD_KEYS.trends);

    if(hit){
      localStorage.setItem(
        TRENDKEY,
        JSON.stringify(hit.value)
      );
    }
  }

  /*
  THIS IS THE IMPORTANT PART.

  Once the old data has been checked/imported, migration is permanently
  marked complete.

  Deleting something from V2 later will NOT cause it to come back.
  */
  localStorage.setItem(MIGRATIONKEY,'true');
}

migrateOldStorage();

function dur(ms){
  if(!isFinite(ms)||ms<0)return 'No data';

  if(ms<60000){
    return Math.round(ms/1000)+' sec';
  }

  let m=Math.round(ms/60000);

  if(m<60){
    return m+' min';
  }

  let h=Math.floor(m/60);
  let r=m%60;

  return r?h+' hr '+r+' min':h+' hr';
}

function localDateTime(){
  let d=new Date();
  d.setMinutes(d.getMinutes()-d.getTimezoneOffset());
  return d.toISOString().slice(0,16);
}

function localDateTimeFromISO(iso){
  if(!iso)return '';

  let d=new Date(iso);

  if(isNaN(d))return '';

  d.setMinutes(d.getMinutes()-d.getTimezoneOffset());

  return d.toISOString().slice(0,16);
}

function eventTime(e){
  return e.kind==='timed'?e.start:e.time;
}

function eventEnd(e){
  return e.kind==='timed'?e.end:null;
}

function isDayTime(d){
  let hm=new Date(d).toTimeString().slice(0,5);

  return hm>=settings.dayStart && hm<settings.nightStart;
}


/*
Repair historical events whose category IDs were lost or changed.

This function ONLY changes category IDs.

It NEVER recreates deleted events.
*/
function migrate(){

  let changed=false;

  events=events.map(e=>{

    if(!e.categoryId){

      const oldName=
        e.legacyCategoryName||
        e.name||
        e.category||
        e.eventName||
        '';

      let c=cats.find(x=>x.name===oldName);

      if(!c){
        c=builtins.find(x=>x.name===oldName);
      }

      if(c){
        e.categoryId=c.id;
        changed=true;
      }else{

        /*
        Preserve an unknown historical event instead of deleting it.
        */
        c=cats.find(x=>x.id==='legacy-unknown');

        if(!c){
          c={
            id:'legacy-unknown',
            name:'Unknown / Legacy Event',
            icon:'🐾',
            kind:e.kind==='timed'?'timed':'instant',
            notesRequired:false,
            quantityEnabled:false,
            quantityLabel:'Amount'
          };

          cats.push(c);
        }

        e.categoryId=c.id;
        changed=true;
      }
    }

    if(e.kind==='timed'&&!('end'in e)){
      e.end=null;
      changed=true;
    }

    if(e.kind==='timed'&&!e.start&&e.time){
      e.start=e.time;
      changed=true;
    }

    return e;
  });

  if(changed)save();
}

function logCategory(id){

  let c=catById(id);

  if(!c)return;

  if(c.kind==='timed'){

    let running=events.find(e=>
      e.categoryId===id&&
      e.kind==='timed'&&
      !e.end
    );

    if(running){
      running.end=new Date().toISOString();
      save();
      renderAll();
      return;
    }

    events.push({
      id:crypto.randomUUID(),
      categoryId:id,
      kind:'timed',
      start:new Date().toISOString(),
      end:null,
      qty:null,
      notes:''
    });

    save();
    renderAll();
    return;
  }

  let fields=`
    <div class="formrow">
      <label>Time</label>
      <input id="evTime" type="datetime-local" value="${localDateTime()}">
    </div>
  `;

  if(c.quantityEnabled||c.kind==='quantity'){
    fields+=`
      <div class="formrow">
        <label>${esc(c.quantityLabel||'Amount')}</label>
        <input id="evQty" type="number" step="any" placeholder="Optional">
      </div>
    `;
  }

  fields+=`
    <div class="formrow">
      <label>Notes${c.notesRequired?'':' (optional)'}</label>
      <textarea id="evNotes" placeholder="What happened?"></textarea>
    </div>
    <button class="primary" onclick="saveInstant('${esc(id)}')">Save</button>
  `;

  openModal('Log '+c.name,fields);
}

window.updateEvent=id=>{

  let e=events.find(x=>x.id===id);

  if(!e)return;

  let c=catById(e.categoryId);

  let notes=$('editNotes').value;

  if(c?.notesRequired&&!notes.trim()){
    alert('Please add a note for this category.');
    return;
  }

  if(e.kind!=='timed'){

    let t=new Date($('editTime').value);

    if(isNaN(t)){
      alert('Please enter a valid time.');
      return;
    }

    e.time=t.toISOString();

    if($('editQty')){
      e.qty=Number($('editQty').value)||null;
    }

    e.notes=notes;

  }else{

    let s=new Date($('editStart').value);

    if(isNaN(s)){
      alert('Please enter a valid start time.');
      return;
    }

    let ev=$('editEnd').value;

    if(ev){

      let end=new Date(ev);

      if(isNaN(end)||end<s){
        alert('End time cannot be before start time.');
        return;
      }

      e.end=end.toISOString();

    }else{
      e.end=null;
    }

    e.start=s.toISOString();
    e.notes=notes;
  }

  save();

  $('modal').classList.remove('show');

  renderAll();
};


window.deleteEvent=id=>{

  if(!confirm('Delete this event?'))return;

  events=events.filter(e=>e.id!==id);

  save();

  $('modal').classList.remove('show');

  renderAll();
};


function completeEvents(){
  return events.filter(e=>e.kind!=='timed'||e.end);
}

function getStart(e){
  return new Date(eventTime(e));
}

function getReferenceEnd(e){
  return e.kind==='timed'&&e.end
    ?new Date(e.end)
    :getStart(e);
}

function eventsForCategory(id){
  return completeEvents()
    .filter(e=>e.categoryId===id)
    .sort((a,b)=>getStart(a)-getStart(b));
}

function inRange(e){

  let cutoff=new Date();

  cutoff.setDate(
    cutoff.getDate()-activeRange+1
  );

  cutoff.setHours(0,0,0,0);

  return getStart(e)>=cutoff;
}

function average(vals){
  return vals.length
    ?vals.reduce((a,b)=>a+b,0)/vals.length
    :null;
}

function avgInterval(id,filterFn){

  let a=eventsForCategory(id)
    .filter(inRange)
    .filter(filterFn||(()=>true));

  let vals=[];

  for(let i=1;i<a.length;i++){
    vals.push(
      getStart(a[i])-getStart(a[i-1])
    );
  }

  return average(vals);
}

function avgDuration(id,filterFn){

  let a=eventsForCategory(id)
    .filter(inRange)
    .filter(filterFn||(()=>true));

  return average(
    a
      .filter(e=>e.kind==='timed'&&e.end)
      .map(e=>new Date(e.end)-new Date(e.start))
  );
}

function relationAverage(
  fromId,
  toId,
  mode,
  windowHours,
  filter
){

  let from=eventsForCategory(fromId).filter(inRange);

  let to=eventsForCategory(toId).filter(inRange);

  let vals=[];

  for(let b of to){

    let bTime=getStart(b);

    let prior=from
      .filter(a=>{

        let ref=getReferenceEnd(a);

        return ref<=bTime&&
          bTime-ref<=windowHours*3600000;

      })
      .sort(
        (a,c)=>getReferenceEnd(c)-getReferenceEnd(a)
      )[0];

    if(prior){

      let v=bTime-getReferenceEnd(prior);

      if(!filter||filter(prior,b)){
        vals.push(v);
      }
    }
  }

  return average(vals);
}

function relationLabel(t){
  return t==='after'?'After':'Before';
}

function periodFilter(period){

  if(period==='day'){
    return e=>isDayTime(getStart(e));
  }

  if(period==='night'){
    return e=>!isDayTime(getStart(e));
  }

  return ()=>true;
}

function trendResult(t){

  if(t.measure==='interval'){

    if(t.compare==='daynight'){

      let day=avgInterval(
        t.categoryId,
        e=>isDayTime(getStart(e))
      );

      let night=avgInterval(
        t.categoryId,
        e=>!isDayTime(getStart(e))
      );

      return {
        html:`
          <div class="row">
            <span class="grow">Day</span>
            <b>${day==null?'No data':dur(day)}</b>
          </div>

          <div class="row">
            <span class="grow">Night</span>
            <b>${night==null?'No data':dur(night)}</b>
          </div>
        `
      };
    }

    let v=avgInterval(
      t.categoryId,
      periodFilter(t.period)
    );

    return {
      html:`
        <div class="trendvalue">
          ${v==null?'No data':dur(v)}
        </div>
      `
    };
  }

  if(t.measure==='duration'){

    if(t.compare==='daynight'){

      let day=avgDuration(
        t.categoryId,
        e=>isDayTime(getStart(e))
      );

      let night=avgDuration(
        t.categoryId,
        e=>!isDayTime(getStart(e))
      );

      return {
        html:`
          <div class="row">
            <span class="grow">Day</span>
            <b>${day==null?'No data':dur(day)}</b>
          </div>

          <div class="row">
            <span class="grow">Night</span>
            <b>${night==null?'No data':dur(night)}</b>
          </div>
        `
      };
    }

    let v=avgDuration(
      t.categoryId,
      periodFilter(t.period)
    );

    return {
      html:`
        <div class="trendvalue">
          ${v==null?'No data':dur(v)}
        </div>
      `
    };
  }

  if(t.measure==='count'){

    let n=eventsForCategory(t.categoryId)
      .filter(inRange)
      .filter(periodFilter(t.period))
      .length;

    return {
      html:`<div class="trendvalue">${n}</div>`
    };
  }

  if(t.measure==='totalduration'){

    let vals=eventsForCategory(t.categoryId)
      .filter(inRange)
      .filter(periodFilter(t.period))
      .filter(e=>e.kind==='timed'&&e.end)
      .map(e=>new Date(e.end)-new Date(e.start));

    return {
      html:`
        <div class="trendvalue">
          ${vals.length
            ?dur(vals.reduce((a,b)=>a+b,0))
            :'No data'}
        </div>
      `
    };
  }

  if(t.measure==='after'||t.measure==='before'){

    let v=relationAverage(
      t.fromCategoryId,
      t.toCategoryId,
      t.measure,
      t.windowHours||24
    );

    if(t.measure==='before'){
      v=relationAverage(
        t.toCategoryId,
        t.fromCategoryId,
        'after',
        t.windowHours||24
      );
    }

    return {
      html:`
        <div class="trendvalue">
          ${v==null?'No data':dur(v)}
        </div>
      `
    };
  }

  return {
    html:'No data'
  };
}

function trendDescription(t){

  if(t.measure==='interval'){
    return `${nameFor(t.categoryId)} · average interval${
      t.compare==='daynight'
        ?' · day vs night'
        :t.period
          ?' · '+t.period
          :''
    }`;
  }

  if(t.measure==='duration'){
    return `${nameFor(t.categoryId)} · average duration${
      t.compare==='daynight'
        ?' · day vs night'
        :t.period
          ?' · '+t.period
          :''
    }`;
  }

  if(t.measure==='count'){
    return `${nameFor(t.categoryId)} · count${
      t.period?' · '+t.period:''
    }`;
  }

  if(t.measure==='totalduration'){
    return `${nameFor(t.categoryId)} · total duration${
      t.period?' · '+t.period:''
    }`;
  }

  return `${nameFor(t.fromCategoryId)} → ${nameFor(t.toCategoryId)} · average time`;
}

function drawChart(){

  let canvas=$('chart');

  let ctx=canvas.getContext('2d');

  let w=canvas.clientWidth*devicePixelRatio;

  let h=230*devicePixelRatio;

  canvas.width=w;

  canvas.height=h;

  ctx.clearRect(0,0,w,h);

  ctx.font=
    `${12*devicePixelRatio}px -apple-system`;

  let now=new Date();

  let days=[];

  for(
    let i=activeRange-1;
    i>=0;
    i--
  ){

    let d=new Date(now);

    d.setHours(0,0,0,0);

    d.setDate(
      d.getDate()-i
    );

    days.push(d);
  }

  let max=Math.max(
    1,
    ...days.map(d=>
      ['pee','poop'].reduce(
        (n,id)=>
          n+
          events.filter(e=>
            e.categoryId===id&&
            new Date(eventTime(e)).toDateString()===
            d.toDateString()
          ).length,
        0
      )
    )
  );

  ctx.strokeStyle='#dfe5e2';

  ctx.fillStyle='#697674';

  ctx.lineWidth=1;

  for(let i=0;i<=max;i++){

    let y=
      h-25-
      (h-55)*i/max;

    ctx.beginPath();

    ctx.moveTo(30,y);

    ctx.lineTo(w-10,y);

    ctx.stroke();

    ctx.fillText(
      i,
      8,
      y+4
    );
  }

  days.forEach((d,i)=>{

    let x=
      45+
      i*((w-60)/Math.max(1,days.length-1));

    let pee=
      events.filter(e=>
        e.categoryId==='pee'&&
        new Date(eventTime(e)).toDateString()===
        d.toDateString()
      ).length;

    let poop=
      events.filter(e=>
        e.categoryId==='poop'&&
        new Date(eventTime(e)).toDateString()===
        d.toDateString()
      ).length;

    ctx.fillStyle='#0f5b55';

    ctx.fillRect(
      x-9,
      h-25-(h-55)*pee/max,
      8,
      (h-55)*pee/max
    );

    ctx.fillStyle='#d98a27';

    ctx.fillRect(
      x+1,
      h-25-(h-55)*poop/max,
      8,
      (h-55)*poop/max
    );

    ctx.fillStyle='#697674';

    ctx.fillText(
      d.toLocaleDateString([],{
        month:'numeric',
        day:'numeric'
      }),
      x-12,
      h-8
    );

  });
}

          )
