<script>

const KEY='puppyTrackerEventsV1';
const CATKEY='puppyTrackerCatsV1';
const SETKEY='puppyTrackerSettingsV1';

const builtins=[
{name:'Pee',icon:'💧',kind:'instant'},
{name:'Poop',icon:'💩',kind:'instant'},
{name:'Potty - Nothing',icon:'✕',kind:'instant'},
{name:'Sleep',icon:'💤',kind:'timed'},
{name:'Crate',icon:'🏠',kind:'timed'},
{name:'Whining',icon:'🔊',kind:'timed'},
{name:'Meal',icon:'🍽️',kind:'quantity'}
];

let events=JSON.parse(localStorage.getItem(KEY)||'[]');
let cats=JSON.parse(localStorage.getItem(CATKEY)||'null')||builtins;
let settings=JSON.parse(localStorage.getItem(SETKEY)||'{"dayStart":"07:00","nightStart":"22:00"}');

let activeRange=3;

const $=id=>document.getElementById(id);

const save=()=>{
localStorage.setItem(KEY,JSON.stringify(events));
localStorage.setItem(CATKEY,JSON.stringify(cats));
localStorage.setItem(SETKEY,JSON.stringify(settings));
};

const fmtTime=d=>new Date(d).toLocaleTimeString([],{
hour:'numeric',
minute:'2-digit'
});

const fmtDate=d=>new Date(d).toLocaleDateString([],{
month:'short',
day:'numeric'
});

function dur(ms){
if(ms<60000)return Math.round(ms/1000)+' sec';

let m=Math.round(ms/60000);

if(m<60)return m+' min';

let h=Math.floor(m/60);
let r=m%60;

return r?h+' hr '+r+' min':h+' hr';
}

function esc(s){
return String(s??'').replace(/[&<>"']/g,c=>({
'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;',
"'":'&#39;'
}[c]));
}

function iconFor(name){
return cats.find(c=>c.name===name)?.icon||'🐾';
}

/*
--------------------------------------------------
EVENT DATA STRUCTURE
--------------------------------------------------

Instant:
{
 id,
 name,
 icon,
 kind:"instant",
 time:"ISO DATE",
 qty:null,
 notes:""
}

Timed:
{
 id,
 name,
 icon,
 kind:"timed",
 start:"ISO DATE",
 end:"ISO DATE" or null,
 qty:null,
 notes:""
}

Quantity:
{
 id,
 name,
 icon,
 kind:"quantity",
 time:"ISO DATE",
 qty:number,
 notes:""
}

--------------------------------------------------
*/

function eventTime(e){
return e.kind==='timed'?e.start:e.time;
}

function eventEnd(e){
return e.kind==='timed'?e.end:null;
}

/*
Convert old events saved by the previous version.

Old instant events had:
start: ...
end: null

New instant events use:
time: ...

Old timed events keep:
start + end
*/

function migrateEvents(){

let changed=false;

events=events.map(e=>{

if(e.kind==='timed'){
if(!('end' in e)){
e.end=null;
changed=true;
}
return e;
}

if(!e.time && e.start){
e.time=e.start;
delete e.start;
delete e.end;
changed=true;
}

return e;

});

if(changed)save();
}

migrateEvents();

function todayEvents(){

let a=new Date();

return events
.filter(e=>new Date(eventTime(e)).toDateString()===a.toDateString())
.sort((a,b)=>new Date(eventTime(b))-new Date(eventTime(a)));

}

function openModal(title,html){

$('modalTitle').textContent=title;
$('modalBody').innerHTML=html;
$('modal').classList.add('show');

}

$('closeModal').onclick=()=>$('modal').classList.remove('show');

/*
--------------------------------------------------
QUICK EVENT BUTTONS
--------------------------------------------------
*/

function renderQuick(){

$('quickGrid').innerHTML=cats.map(c=>{

let running=c.kind==='timed' &&
events.some(e=>e.name===c.name && e.kind==='timed' && !e.end);

return `
<button class="eventbtn ${running?'running':''}" onclick="logCategory('${esc(c.name)}')">
<span>${c.icon}</span>
${esc(c.name)}
</button>
`;

}).join('');

}

/*
--------------------------------------------------
LOG EVENT
--------------------------------------------------
*/

function logCategory(name){

const c=cats.find(x=>x.name===name);

if(!c)return;

/*
Timed events use the button as Start/Stop.
*/

if(c.kind==='timed'){

let running=events.find(e=>
e.name===name &&
e.kind==='timed' &&
!e.end
);

if(running){

running.end=new Date().toISOString();

save();
renderAll();

return;

}

events.push({
id:crypto.randomUUID(),
name,
icon:c.icon,
kind:'timed',
start:new Date().toISOString(),
end:null,
qty:null,
notes:''
});

save();
renderAll();

return;
}

/*
Instant and quantity events open the editor.
*/

let fields=`
<div class="formrow">
<label>Time</label>
<input id="evTime" type="datetime-local" value="${localDateTime()}">
</div>
`;

if(c.kind==='quantity'){

fields+=`
<div class="formrow">
<label>Amount (optional)</label>
<input id="evQty" type="number" step="any" placeholder="e.g. 0.5">
</div>
`;

}

fields+=`
<div class="formrow">
<label>Notes</label>
<textarea id="evNotes" placeholder="What happened?"></textarea>
</div>

<button class="primary" onclick="saveInstant('${esc(name)}')">
Save
</button>
`;

openModal('Log '+name,fields);

}

function localDateTime(){

let d=new Date();

d.setMinutes(
d.getMinutes()-d.getTimezoneOffset()
);

return d.toISOString().slice(0,16);

}

window.saveInstant=name=>{

let c=cats.find(x=>x.name===name);

if(!c)return;

let t=new Date($('evTime').value);

if(isNaN(t)){
alert('Please enter a valid time.');
return;
}

events.push({
id:crypto.randomUUID(),
name,
icon:c.icon,
kind:c.kind,
time:t.toISOString(),
qty:$('evQty')?Number($('evQty').value)||null:null,
notes:$('evNotes').value
});

save();

$('modal').classList.remove('show');

renderAll();

};

/*
--------------------------------------------------
TODAY
--------------------------------------------------
*/

function renderToday(){

let a=todayEvents();

let pees=a.filter(e=>e.name==='Pee').length;
let poops=a.filter(e=>e.name==='Poop').length;

$('peeCount').textContent=pees;
$('poopCount').textContent=poops;

$('sleepTotal').textContent=dur(

a
.filter(e=>e.name==='Sleep'&&e.kind==='timed'&&e.end)
.reduce(
(s,e)=>s+(new Date(e.end)-new Date(e.start)),
0
)

||0

);

/*
Only actual timed events can appear here.
Instant events can NEVER be running.
*/

let running=events.filter(e=>
e.kind==='timed' &&
!e.end
);

$('runningCard').innerHTML=running.length?

`
<div class="card">
<h3>Currently active</h3>

${running.map(e=>`

<div class="row">

<span>${e.icon}</span>

<div class="grow">

<b>${esc(e.name)}</b>

<div class="muted">
Started ${fmtTime(e.start)}
· ${dur(Date.now()-new Date(e.start))}
</div>

</div>

<button class="primary" onclick="stopEvent('${e.id}')">
STOP
</button>

</div>

`).join('')}

</div>
`

:'';

/*
Timeline.
Instant events show ONE time only.
Timed events show start + duration/end.
*/

$('timeline').innerHTML=a.length?

a.map(e=>{

let timeText='';

if(e.kind==='timed'){

timeText=fmtTime(e.start);

if(e.end){

timeText+=' · '+dur(
new Date(e.end)-new Date(e.start)
);

}else{

timeText+=' · Active';

}

}else{

timeText=fmtTime(e.time);

}

return `
<div class="row">

<span>${e.icon}</span>

<div class="grow">

<b>${esc(e.name)}</b>

<div class="muted">
${timeText}
${e.qty!=null?' · '+e.qty:''}
</div>

${e.notes?
`<div class="muted">${esc(e.notes)}</div>`
:''}

</div>

<button class="smallbtn" onclick="editEvent('${e.id}')">
Edit
</button>

</div>
`;

}).join('')

:

'<div class="empty">No events yet.</div>';

}

window.stopEvent=id=>{

let e=events.find(x=>x.id===id);

if(e && e.kind==='timed'){

e.end=new Date().toISOString();

save();
renderAll();

}

};

/*
--------------------------------------------------
EDIT EVENT
--------------------------------------------------

This is where the time editing happens.

Instant:
one datetime field.

Timed:
start datetime + end datetime.

No end field exists for instant events.
*/

window.editEvent=id=>{

let e=events.find(x=>x.id===id);

if(!e)return;

let html='';

/*
Instant event
*/

if(e.kind!=='timed'){

html+=`
<div class="formrow">
<label>Time</label>
<input id="editTime" type="datetime-local" value="${localDateTimeFromISO(e.time)}">
</div>
`;

if(e.kind==='quantity'){

html+=`
<div class="formrow">
<label>Amount (optional)</label>
<input id="editQty" type="number" step="any" value="${e.qty??''}">
</div>
`;

}

html+=`
<div class="formrow">
<label>Notes</label>
<textarea id="editNotes">${esc(e.notes)}</textarea>
</div>

<button class="primary" onclick="updateEvent('${id}')">
Save changes
</button>

<button class="secondary" style="margin-left:8px" onclick="deleteEvent('${id}')">
Delete
</button>
`;

openModal('Edit event',html);

return;

}

/*
Timed event
*/

html+=`
<div class="formrow">
<label>Start time</label>
<input id="editStart" type="datetime-local" value="${localDateTimeFromISO(e.start)}">
</div>
`;

if(e.end){

html+=`
<div class="formrow">
<label>End time</label>
<input id="editEnd" type="datetime-local" value="${localDateTimeFromISO(e.end)}">
</div>
`;

}else{

html+=`
<div class="formrow">
<label>End time</label>
<input id="editEnd" type="datetime-local">
<div class="muted" style="margin-top:5px">
Leave blank if this event is still active.
</div>
</div>
`;

}

html+=`
<div class="formrow">
<label>Notes</label>
<textarea id="editNotes">${esc(e.notes)}</textarea>
</div>

<button class="primary" onclick="updateEvent('${id}')">
Save changes
</button>

<button class="secondary" style="margin-left:8px" onclick="deleteEvent('${id}')">
Delete
</button>
`;

openModal('Edit '+e.name,html);

};

function localDateTimeFromISO(iso){

if(!iso)return '';

let d=new Date(iso);

if(isNaN(d))return '';

d.setMinutes(
d.getMinutes()-d.getTimezoneOffset()
);

return d.toISOString().slice(0,16);

}

window.updateEvent=id=>{

let e=events.find(x=>x.id===id);

if(!e)return;

/*
Instant / quantity
*/

if(e.kind!=='timed'){

let t=new Date($('editTime').value);

if(isNaN(t)){

alert('Please enter a valid time.');

return;

}

e.time=t.toISOString();

e.notes=$('editNotes').value;

if(e.kind==='quantity'){

e.qty=$('editQty')?
Number($('editQty').value)||null:
null;

}

}else{

/*
Timed event
*/

let start=new Date($('editStart').value);

if(isNaN(start)){

alert('Please enter a valid start time.');

return;

}

let endValue=$('editEnd').value;

if(endValue){

let end=new Date(endValue);

if(isNaN(end)){

alert('Please enter a valid end time.');

return;

}

if(end<start){

alert('End time cannot be before start time.');

return;

}

e.end=end.toISOString();

}else{

e.end=null;

}

e.start=start.toISOString();

e.notes=$('editNotes').value;

}

save();

$('modal').classList.remove('show');

renderAll();

};

window.deleteEvent=id=>{

if(!confirm('Delete this event?'))return;

events=events.filter(e=>e.id!==id);

save();

$('modal').classList.remove('show');

renderAll();

};

/*
--------------------------------------------------
TRENDS
--------------------------------------------------
*/

function averageInterval(name){

let a=events
.filter(e=>e.name===name)
.sort((x,y)=>new Date(eventTime(x))-new Date(eventTime(y)));

if(a.length<2)return 'Not enough data';

let vals=[];

for(let i=1;i<a.length;i++){

vals.push(
new Date(eventTime(a[i]))-
new Date(eventTime(a[i-1]))
);

}

return dur(
vals.reduce((a,b)=>a+b,0)/vals.length
);

}

function avgDuration(name){

let a=events
.filter(e=>e.name===name&&e.kind==='timed'&&e.end)
.map(e=>new Date(e.end)-new Date(e.start));

return a.length?
dur(a.reduce((x,y)=>x+y,0)/a.length):
'No data';

}

function totalDuration(name){

let a=events
.filter(e=>e.name===name&&e.kind==='timed'&&e.end)
.map(e=>new Date(e.end)-new Date(e.start));

return dur(
a.reduce((x,y)=>x+y,0)||0
);

}

function nearestBefore(time,names){

let a=events
.filter(e=>
names.includes(e.name)&&
new Date(eventTime(e))<=time
)
.sort(
(x,y)=>
new Date(eventTime(y))-
new Date(eventTime(x))
);

return a[0];

}

function relationshipText(){

let p=events.filter(e=>e.name==='Pee');

let wake=events.filter(e=>
e.name==='Sleep'&&
e.kind==='timed'&&
e.end
);

let meals=events.filter(e=>e.name==='Meal');

function avgAfter(list,targets){

let vals=[];

for(let e of list){

let prior=targets
.filter(x=>
new Date(x.end||eventTime(x))<=new Date(eventTime(e))
)
.sort(
(a,b)=>
new Date(b.end||eventTime(b))-
new Date(a.end||eventTime(a))
)[0];

if(prior){

vals.push(
new Date(eventTime(e))-
new Date(prior.end||eventTime(prior))
);

}

}

return vals.length?
dur(vals.reduce((a,b)=>a+b,0)/vals.length):
'No data';

}

return `
<div class="row">
<div class="grow">Average pee after waking</div>
<b>${avgAfter(p,wake)}</b>
</div>

<div class="row">
<div class="grow">Average pee after meal</div>
<b>${avgAfter(p,meals)}</b>
</div>
`;

}

function renderTrends(){

$('summary').innerHTML=[

['Average time between pees',averageInterval('Pee')],
['Average time between poops',averageInterval('Poop')],
['Average sleep duration',avgDuration('Sleep')],
['Average crate duration',avgDuration('Crate')],
['Total whining',totalDuration('Whining')]

].map(x=>`

<div class="row">
<span class="grow">${x[0]}</span>
<b>${x[1]}</b>
</div>

`).join('');

$('relationships').innerHTML=relationshipText();

drawChart();

}

function drawChart(){

let canvas=$('chart');
let ctx=canvas.getContext('2d');

let w=canvas.clientWidth*devicePixelRatio;
let h=230*devicePixelRatio;

canvas.width=w;
canvas.height=h;

ctx.clearRect(0,0,w,h);

ctx.font=`${12*devicePixelRatio}px -apple-system`;

let now=new Date();
let days=[];

for(let i=activeRange-1;i>=0;i--){

let d=new Date(now);

d.setHours(0,0,0,0);
d.setDate(d.getDate()-i);

days.push(d);

}

let max=Math.max(

1,

...days.map(d=>

events.filter(e=>
e.name==='Pee'&&
new Date(eventTime(e)).toDateString()===d.toDateString()
).length+

events.filter(e=>
e.name==='Poop'&&
new Date(eventTime(e)).toDateString()===d.toDateString()
).length

)

);

ctx.strokeStyle='#dfe5e2';
ctx.fillStyle='#697674';
ctx.lineWidth=1;

for(let i=0;i<=max;i++){

let y=h-25-(h-55)*i/max;

ctx.beginPath();
ctx.moveTo(30,y);
ctx.lineTo(w-10,y);
ctx.stroke();

ctx.fillText(i,8,y+4);

}

days.forEach((d,i)=>{

let x=45+i*((w-60)/Math.max(1,days.length-1));

let pee=events.filter(e=>
e.name==='Pee'&&
new Date(eventTime(e)).toDateString()===d.toDateString()
).length;

let poop=events.filter(e=>
e.name==='Poop'&&
new Date(eventTime(e)).toDateString()===d.toDateString()
).length;

ctx.fillStyle='#0f5b55';

ctx.fillRect(
x-9,
h-25-(h-55)*pee/max,
8,
(h-55)*pee/max
);

ctx.fillStyle='#d98a27';

ctx.fillRect(
x+1,
h-25-(h-55)*poop/max,
8,
(h-55)*poop/max
);

ctx.fillStyle='#697674';

ctx.fillText(
d.toLocaleDateString([],{month:'numeric',day:'numeric'}),
x-12,
h-8
);

});

}

$('rangePills').onclick=e=>{

if(e.target.dataset.days){

activeRange=Number(e.target.dataset.days);

document
.querySelectorAll('.pill')
.forEach(x=>
x.classList.toggle('active',x===e.target)
);

renderTrends();

}

};

/*
--------------------------------------------------
HISTORY
--------------------------------------------------
*/

function renderHistory(){

let q=$('search').value.toLowerCase();

let a=[...events]
.sort(
(x,y)=>
new Date(eventTime(y))-
new Date(eventTime(x))
)
.filter(e=>
(e.name+' '+e.notes).toLowerCase().includes(q)
);

$('historyList').innerHTML=a.length?

a.map(e=>{

let detail=fmtDate(eventTime(e))+' · ';

if(e.kind==='timed'){

detail+=fmtTime(e.start);

if(e.end){

detail+=' · '+dur(
new Date(e.end)-new Date(e.start)
);

}else{

detail+=' · Active';

}

}else{

detail+=fmtTime(e.time);

}

if(e.qty!=null){

detail+=' · '+e.qty;

}

return `
<div class="row">

<span>${e.icon}</span>

<div class="grow">

<b>${esc(e.name)}</b>

<div class="muted">${detail}</div>

${e.notes?
`<div class="muted">${esc(e.notes)}</div>`
:''}

</div>

<button class="smallbtn" onclick="editEvent('${e.id}')">
Edit
</button>

</div>
`;

}).join('')

:

'<div class="empty">No matching events.</div>';

}

$('search').oninput=renderHistory;

EXPORT

$('exportBtn').onclick=()=>{

let rows=[
[
'id',
'event',
'event_type',
'time',
'start',
'end',
'duration_seconds',
'quantity',
'notes',
'day_or_night'
]
];

for(let e of events){

let time=eventTime(e);
let d=new Date(time);

let hm=d.toTimeString().slice(0,5);

let night=
hm>=settings.nightStart||
hm<settings.dayStart?
'Night':
'Day';

let start='';
let end='';
let duration='';

if(e.kind==='timed'){

start=e.start;
end=e.end||'';

duration=e.end?
((new Date(e.end)-new Date(e.start))/1000):
'';

}else{

time=e.time;

}

rows.push([

e.id,
e.name,
e.kind,
e.kind==='timed'?'':time,
start,
end,
duration,
e.qty??'',
e.notes,
night

]);

}

let csv=rows
.map(r=>
r.map(v=>
`"${String(v).replaceAll('"','""')}"`
).join(',')
)
.join('\n');

let blob=new Blob(
[csv],
{type:'text/csv'}
);

let url=URL.createObjectURL(blob);

let a=document.createElement('a');

a.href=url;
a.download='puppy_tracker.csv';

a.click();

URL.revokeObjectURL(url);

};
