<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f5b55">
<link rel="manifest" href="manifest.webmanifest">
<title>Puppy Tracker</title>
<style>
:root{--ink:#24302f;--muted:#697674;--bg:#f7f7f4;--card:#fff;--accent:#0f5b55;--line:#dfe5e2;--danger:#b33b3b}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{padding:18px 18px 10px;position:sticky;top:0;background:rgba(247,247,244,.95);backdrop-filter:blur(10px);z-index:5}
h1{margin:0;font-size:28px}.date{color:var(--muted);margin-top:3px}
nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:7px 4px calc(7px + env(safe-area-inset-bottom));z-index:10}
nav button{flex:1;border:0;background:none;color:var(--muted);font-size:12px;padding:7px 2px}nav button.active{color:var(--accent);font-weight:700}
main{padding:8px 16px 95px;max-width:720px;margin:auto}.view{display:none}.view.active{display:block}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.eventbtn{border:1px solid var(--line);background:var(--card);border-radius:18px;padding:15px 6px;min-height:88px;font-weight:700;color:var(--ink);box-shadow:0 2px 8px #00000008}.eventbtn span{display:block;font-size:27px;margin-bottom:5px}.eventbtn.running{background:#e7f3f0;border-color:var(--accent);color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;margin:12px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{text-align:center}.stat b{display:block;font-size:21px}.stat small{color:var(--muted)}
h2{font-size:18px;margin:20px 0 9px}h3{margin:0 0 8px}.row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.grow{flex:1}.muted{color:var(--muted);font-size:13px}
button{font:inherit;cursor:pointer}.primary{background:var(--accent);color:#fff;border:0;border-radius:13px;padding:11px 15px;font-weight:700}.secondary{background:#eef2f0;border:0;border-radius:12px;padding:9px 12px}.danger{color:var(--danger)}
input,textarea,select{width:100%;border:1px solid var(--line);border-radius:11px;padding:11px;background:#fff;font:inherit}textarea{min-height:80px}
.formrow{margin:12px 0}.formrow label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal{position:fixed;inset:0;background:#0006;display:none;align-items:flex-end;z-index:20}.modal.show{display:flex}.sheet{background:var(--bg);width:100%;max-height:90vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(25px + env(safe-area-inset-bottom));}.sheethead{display:flex;justify-content:space-between;align-items:center}
.badge{display:inline-block;background:#edf3f1;color:var(--accent);border-radius:999px;padding:4px 8px;font-size:12px}.empty{text-align:center;color:var(--muted);padding:25px 5px}
canvas{width:100%;height:230px}.pillrow{display:flex;gap:7px;overflow:auto}.pill{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px}.pill.active{background:var(--accent);color:#fff}
.smallbtn{border:0;background:none;color:var(--danger);padding:5px}
</style>
</head>
<body>
<header><h1>Puppy Tracker</h1><div class="date" id="date"></div></header>
<main>
<section id="today" class="view active">
  <div class="stats card">
    <div class="stat"><b id="peeCount">0</b><small>Pee</small></div>
    <div class="stat"><b id="poopCount">0</b><small>Poop</small></div>
    <div class="stat"><b id="sleepTotal">0m</b><small>Sleep</small></div>
  </div>
  <h2>Log an event</h2>
  <div class="grid" id="quickGrid"></div>
  <div id="runningCard"></div>
  <h2>Today</h2>
  <div class="card" id="timeline"></div>
</section>

<section id="trends" class="view">
  <div class="card">
    <div class="pillrow" id="rangePills">
      <button class="pill active" data-days="3">3 days</button><button class="pill" data-days="7">7 days</button><button class="pill" data-days="14">14 days</button><button class="pill" data-days="30">30 days</button>
    </div>
  </div>
  <div class="card"><h3>Potty events</h3><canvas id="chart"></canvas></div>
  <div class="card"><h3>Automatic summaries</h3><div id="summary"></div></div>
  <div class="card"><h3>Potty relative to sleep & meals</h3><div id="relationships"></div></div>
</section>

<section id="history" class="view">
  <div class="card"><input id="search" placeholder="Search events or notes"></div>
  <div class="card" id="historyList"></div>
</section>

<section id="settings" class="view">
  <div class="card"><h3>Custom categories</h3><div id="categoryList"></div><button class="primary" id="addCategoryBtn">Add category</button></div>
  <div class="card"><h3>Day / night</h3><div class="two"><div class="formrow"><label>Day starts</label><input type="time" id="dayStart" value="07:00"></div><div class="formrow"><label>Night starts</label><input type="time" id="nightStart" value="22:00"></div></div><button class="secondary" id="saveTimes">Save times</button></div>
  <div class="card"><h3>Data</h3><p class="muted">Events stay on this device. Export a CSV backup whenever you want.</p><button class="primary" id="exportBtn">Export CSV</button></div>
</section>
</main>

<nav>
<button data-view="today" class="active">Today</button><button data-view="trends">Trends</button><button data-view="history">History</button><button data-view="settings">Settings</button>
</nav>

<div class="modal" id="modal"><div class="sheet"><div class="sheethead"><h2 id="modalTitle">Add event</h2><button class="secondary" id="closeModal">Close</button></div><div id="modalBody"></div></div></div>

<script>
<script>
const KEY = 'puppyTrackerEventsV1';
const CATKEY = 'puppyTrackerCatsV1';
const SETKEY = 'puppyTrackerSettingsV1';

const builtins = [
  {name:'Pee', icon:'💧', kind:'instant'},
  {name:'Poop', icon:'💩', kind:'instant'},
  {name:'Potty - Nothing', icon:'✕', kind:'instant'},
  {name:'Sleep', icon:'💤', kind:'timed'},
  {name:'Crate', icon:'🏠', kind:'timed'},
  {name:'Whining', icon:'🔊', kind:'timed'},
  {name:'Meal', icon:'🍽️', kind:'quantity'}
];

const defaultSettings = {
  puppyName: 'Puppy',
  units: 'US',
  dark: false
};

let events = JSON.parse(localStorage.getItem(KEY) || '[]');
let savedCats = JSON.parse(localStorage.getItem(CATKEY) || 'null');
let settings = {
  ...defaultSettings,
  ...(JSON.parse(localStorage.getItem(SETKEY) || 'null') || {})
};

/* -------------------------------------------------------
   CATEGORY LOADING
   ------------------------------------------------------- */

function loadCategories() {
  if (!Array.isArray(savedCats)) {
    return [...builtins];
  }

  /*
    Always use the built-in category definitions from the
    current version of the app.

    This prevents an old saved category from saying,
    for example, Pee = timed.
  */

  const correctedBuiltins = builtins.map(builtin => {
    const old = savedCats.find(c => c.name === builtin.name);

    return {
      ...builtin,
      icon: old?.icon || builtin.icon,
      kind: builtin.kind
    };
  });

  /*
    Keep custom categories from the old version.
  */
  const customCategories = savedCats.filter(c =>
    !builtins.some(b => b.name === c.name)
  );

  return [...correctedBuiltins, ...customCategories];
}

let cats = loadCategories();

/* -------------------------------------------------------
   DATA REPAIR / MIGRATION
   ------------------------------------------------------- */

function makeId() {
  if (window.crypto && crypto.randomUUID) {
    return crypto.randomUUID();
  }

  return Date.now().toString(36) + Math.random().toString(36).slice(2);
}

function normalizeEvents() {
  events = events.map(e => {
    const category = cats.find(c => c.name === e.name);

    /*
      If this is a built-in category, the category definition
      above wins over whatever the old event says.
    */
    const kind = category
      ? category.kind
      : (e.kind || 'instant');

    const icon = category?.icon || e.icon || '🐾';

    if (kind === 'timed') {
      return {
        id: e.id || makeId(),
        name: e.name,
        icon,
        kind: 'timed',
        start: e.start || e.time || new Date().toISOString(),
        end: e.end ?? null,
        notes: e.notes || '',
        qty: e.qty ?? null
      };
    }

    /*
      Instant and quantity events are POINT EVENTS.

      Old versions stored their timestamp as "start".
      Convert that to "time".
    */
    return {
      id: e.id || makeId(),
      name: e.name,
      icon,
      kind,
      time: e.time || e.start || new Date().toISOString(),
      notes: e.notes || '',
      qty: kind === 'quantity' ? (e.qty ?? null) : null
    };
  });

  save();
}

normalizeEvents();

function save() {
  localStorage.setItem(KEY, JSON.stringify(events));
  localStorage.setItem(CATKEY, JSON.stringify(cats));
  localStorage.setItem(SETKEY, JSON.stringify(settings));
}

/* -------------------------------------------------------
   GENERAL HELPERS
   ------------------------------------------------------- */

function isTimed(e) {
  return e.kind === 'timed';
}

function eventTime(e) {
  return isTimed(e) ? e.start : e.time;
}

function eventEnd(e) {
  return isTimed(e) ? e.end : null;
}

function fmtTime(iso) {
  if (!iso) return '';

  return new Date(iso).toLocaleTimeString([], {
    hour: 'numeric',
    minute: '2-digit'
  });
}

function fmtDateTime(iso) {
  if (!iso) return '';

  return new Date(iso).toLocaleString([], {
    month: 'short',
    day: 'numeric',
    year: 'numeric',
    hour: 'numeric',
    minute: '2-digit'
  });
}

function toDateInputValue(iso) {
  if (!iso) return '';

  const d = new Date(iso);

  const pad = n => String(n).padStart(2, '0');

  return (
    d.getFullYear() +
    '-' +
    pad(d.getMonth() + 1) +
    '-' +
    pad(d.getDate()) +
    'T' +
    pad(d.getHours()) +
    ':' +
    pad(d.getMinutes())
  );
}

function fromDateInputValue(value) {
  if (!value) return null;

  return new Date(value).toISOString();
}

function durationMinutes(start, end) {
  if (!start) return 0;

  const finish = end ? new Date(end) : new Date();
  const begin = new Date(start);

  return Math.max(
    0,
    Math.round((finish - begin) / 60000)
  );
}

function durationText(minutes) {
  if (minutes < 1) return '<1 min';

  const hours = Math.floor(minutes / 60);
  const mins = minutes % 60;

  if (hours === 0) {
    return `${mins} min`;
  }

  if (mins === 0) {
    return `${hours} hr`;
  }

  return `${hours} hr ${mins} min`;
}

function kindLabel(kind) {
  if (kind === 'timed') return 'Timed event';
  if (kind === 'quantity') return 'One-time + amount';
  return 'One-time event';
}

function todayStart() {
  const d = new Date();

  d.setHours(0, 0, 0, 0);

  return d;
}

function todayEnd() {
  const d = new Date();

  d.setHours(23, 59, 59, 999);

  return d;
}

function todayEvents() {
  const start = todayStart();
  const end = todayEnd();

  return events
    .filter(e => {
      const t = new Date(eventTime(e));

      return t >= start && t <= end;
    })
    .sort((a, b) =>
      new Date(eventTime(b)) - new Date(eventTime(a))
    );
}

/* -------------------------------------------------------
   MODAL
   ------------------------------------------------------- */

let modal = null;

function openModal(title, html) {
  closeModal();

  modal = document.createElement('div');

  modal.className = 'modal-backdrop';

  modal.innerHTML = `
    <div class="modal">
      <div class="modal-header">
        <h2>${title}</h2>
        <button class="icon-button" onclick="closeModal()">×</button>
      </div>

      ${html}
    </div>
  `;

  document.body.appendChild(modal);
}

function closeModal() {
  if (modal) {
    modal.remove();
    modal = null;
  }
}

/* -------------------------------------------------------
   QUICK LOGGING
   ------------------------------------------------------- */

let pendingPointEvent = null;

function logCategory(name) {
  const category = cats.find(c => c.name === name);

  if (!category) return;

  /*
    TIMED EVENTS
    -------------------------
    These are the only events that can be running.
  */
  if (category.kind === 'timed') {
    const running = events.find(e =>
      e.name === name &&
      e.kind === 'timed' &&
      !e.end
    );

    if (running) {
      running.end = new Date().toISOString();

      save();
      renderAll();

      return;
    }

    events.push({
      id: makeId(),
      name: category.name,
      icon: category.icon,
      kind: 'timed',
      start: new Date().toISOString(),
      end: null,
      notes: '',
      qty: null
    });

    save();
    renderAll();

    return;
  }

  /*
    POINT EVENTS
    -------------------------
    These are recorded immediately at the moment
    the button is tapped.

    There is NO start/stop concept.
  */

  pendingPointEvent = {
    id: makeId(),
    name: category.name,
    icon: category.icon,
    kind: category.kind,
    time: new Date().toISOString(),
    notes: '',
    qty: null
  };

  let quantityHTML = '';

  if (category.kind === 'quantity') {
    quantityHTML = `
      <div class="form-row">
        <label for="pointQty">Amount</label>
        <input
          id="pointQty"
          type="number"
          step="0.1"
          min="0"
          placeholder="Optional"
        >
      </div>
    `;
  }

  openModal(
    category.icon + ' ' + category.name,
    `
      <div class="event-time-display">
        <div class="muted">Recorded at</div>
        <strong>${fmtDateTime(pendingPointEvent.time)}</strong>
      </div>

      ${quantityHTML}

      <div class="form-row">
        <label for="pointNotes">Notes</label>
        <textarea
          id="pointNotes"
          rows="4"
          placeholder="What happened?"
        ></textarea>
      </div>

      <div class="modal-actions">
        <button class="secondary" onclick="cancelPointEvent()">
          Cancel
        </button>

        <button class="primary" onclick="savePointEvent()">
          Save Event
        </button>
      </div>
    `
  );
}

function cancelPointEvent() {
  pendingPointEvent = null;
  closeModal();
}

function savePointEvent() {
  if (!pendingPointEvent) return;

  const notes = document.getElementById('pointNotes')?.value.trim() || '';

  if (!notes) {
    alert('Please add a note for this event.');
    return;
  }

  const qtyInput = document.getElementById('pointQty');

  if (qtyInput) {
    pendingPointEvent.qty = qtyInput.value
      ? Number(qtyInput.value)
      : null;
  }

  pendingPointEvent.notes = notes;

  events.push(pendingPointEvent);

  pendingPointEvent = null;

  save();
  closeModal();
  renderAll();
}

/* -------------------------------------------------------
   RENDER QUICK BUTTONS
   ------------------------------------------------------- */

function renderQuick() {
  const container = document.getElementById('quickButtons');

  if (!container) return;

  container.innerHTML = '';

  cats.forEach(c => {
    const button = document.createElement('button');

    button.className = 'quick-button';

    const running = c.kind === 'timed' &&
      events.some(e =>
        e.name === c.name &&
        e.kind === 'timed' &&
        !e.end
      );

    if (running) {
      button.classList.add('running');
    }

    button.innerHTML = `
      <span class="quick-icon">${c.icon}</span>
      <span>${c.name}</span>
    `;

    button.onclick = () => logCategory(c.name);

    container.appendChild(button);
  });
}

/* -------------------------------------------------------
   RUNNING EVENTS
   ------------------------------------------------------- */

function renderRunning() {
  const container = document.getElementById('runningEvents');

  if (!container) return;

  const running = events
    .filter(e => e.kind === 'timed' && !e.end)
    .sort((a, b) =>
      new Date(a.start) - new Date(b.start)
    );

  if (!running.length) {
    container.innerHTML = '';
    return;
  }

  container.innerHTML = `
    <div class="running-card">
      <div class="running-title">Currently running</div>

      ${running.map(e => `
        <div class="running-event">
          <div>
            <strong>${e.icon} ${e.name}</strong>
            <div class="muted">
              Started ${fmtTime(e.start)}
            </div>
          </div>

          <button
            class="stop-button"
            onclick="stopEvent('${e.id}')"
          >
            STOP
          </button>
        </div>
      `).join('')}
    </div>
  `;
}

function stopEvent(id) {
  const event = events.find(e => e.id === id);

  if (!event) return;

  if (event.kind !== 'timed') {
    return;
  }

  event.end = new Date().toISOString();

  save();
  renderAll();
}

/* -------------------------------------------------------
   TODAY
   ------------------------------------------------------- */

function renderToday() {
  const container = document.getElementById('todayEvents');

  if (!container) return;

  const list = todayEvents();

  if (!list.length) {
    container.innerHTML = `
      <div class="empty-state">
        No events recorded today.
      </div>
    `;

    return;
  }

  container.innerHTML = list.map(e => {
    const timed = e.kind === 'timed';

    let details = '';

    if (timed) {
      if (e.end) {
        details = `
          ${fmtTime(e.start)}–${fmtTime(e.end)}
          · ${durationText(durationMinutes(e.start, e.end))}
        `;
      } else {
        details = `
          Started ${fmtTime(e.start)}
          · ${durationText(durationMinutes(e.start, null))}
        `;
      }
    } else {
      details = fmtTime(e.time);

      if (e.kind === 'quantity' && e.qty !== null) {
        details += ` · ${e.qty}`;
      }
    }

    return `
      <div class="event-row">
        <div class="event-icon">${e.icon}</div>

        <div class="event-main">
          <div class="event-name">${e.name}</div>

          <div class="event-details">
            ${details}
          </div>

          ${e.notes ? `
            <div class="event-notes">
              ${escapeHTML(e.notes)}
            </div>
          ` : ''}
        </div>

        <button
          class="edit-button"
          onclick="editEvent('${e.id}')"
        >
          Edit
        </button>
      </div>
    `;
  }).join('');
}

/* -------------------------------------------------------
   EDIT EVENTS
   ------------------------------------------------------- */

function editEvent(id) {
  const event = events.find(e => e.id === id);

  if (!event) return;

  if (event.kind === 'timed') {
    openModal(
      `Edit ${event.icon} ${event.name}`,
      `
        <div class="form-row">
          <label for="editStart">Start</label>

          <input
            id="editStart"
            type="datetime-local"
            value="${toDateInputValue(event.start)}"
          >
        </div>

        <div class="form-row">
          <label for="editEnd">End</label>

          <input
            id="editEnd"
            type="datetime-local"
            value="${toDateInputValue(event.end)}"
          >
        </div>

        <div class="form-row">
          <label for="editNotes">Notes</label>

          <textarea
            id="editNotes"
            rows="4"
          >${escapeHTML(event.notes || '')}</textarea>
        </div>

        <div class="modal-actions">
          <button
            class="danger"
            onclick="deleteEvent('${event.id}')"
          >
            Delete
          </button>

          <button
            class="primary"
            onclick="saveTimedEdit('${event.id}')"
          >
            Save Changes
          </button>
        </div>
      `
    );

    return;
  }

  /*
    POINT EVENT EDITOR

    This is the ONLY place where a point event's
    time can be changed.

    It still has only ONE timestamp.
  */

  let quantityHTML = '';

  if (event.kind === 'quantity') {
    quantityHTML = `
      <div class="form-row">
        <label for="editQty">Amount</label>

        <input
          id="editQty"
          type="number"
          step="0.1"
          min="0"
          value="${event.qty ?? ''}"
        >
      </div>
    `;
  }

  openModal(
    `Edit ${event.icon} ${event.name}`,
    `
      <div class="form-row">
        <label for="editTime">Event time</label>

        <input
          id="editTime"
          type="datetime-local"
          value="${toDateInputValue(event.time)}"
        >
      </div>

      ${quantityHTML}

      <div class="form-row">
        <label for="editNotes">Notes</label>

        <textarea
          id="editNotes"
          rows="4"
        >${escapeHTML(event.notes || '')}</textarea>
      </div>

      <div class="modal-actions">
        <button
          class="danger"
          onclick="deleteEvent('${event.id}')"
        >
          Delete
        </button>

        <button
          class="primary"
          onclick="savePointEdit('${event.id}')"
        >
          Save Changes
        </button>
      </div>
    `
  );
}

function savePointEdit(id) {
  const event = events.find(e => e.id === id);

  if (!event) return;

  const time = document.getElementById('editTime')?.value;
  const notes = document.getElementById('editNotes')?.value.trim() || '';

  if (!time) {
    alert('Please enter an event time.');
    return;
  }

  if (!notes) {
    alert('Please add a note for this event.');
    return;
  }

  event.time = fromDateInputValue(time);
  event.notes = notes;

  const qtyInput = document.getElementById('editQty');

  if (qtyInput) {
    event.qty = qtyInput.value
      ? Number(qtyInput.value)
      : null;
  }

  save();
  closeModal();
  renderAll();
}

function saveTimedEdit(id) {
  const event = events.find(e => e.id === id);

  if (!event) return;

  const start = document.getElementById('editStart')?.value;
  const end = document.getElementById('editEnd')?.value;
  const notes = document.getElementById('editNotes')?.value.trim() || '';

  if (!start) {
    alert('Please enter a start time.');
    return;
  }

  if (!notes) {
    alert('Please add a note for this event.');
    return;
  }

  const startISO = fromDateInputValue(start);
  const endISO = end ? fromDateInputValue(end) : null;

  if (endISO && new Date(endISO) < new Date(startISO)) {
    alert('End time cannot be before start time.');
    return;
  }

  event.start = startISO;
  event.end = endISO;
  event.notes = notes;

  save();
  closeModal();
  renderAll();
}

function deleteEvent(id) {
  const event = events.find(e => e.id === id);

  if (!event) return;

  if (!confirm(`Delete ${event.name}?`)) {
    return;
  }

  events = events.filter(e => e.id !== id);

  save();
  closeModal();
  renderAll();
}

/* -------------------------------------------------------
   HISTORY
   ------------------------------------------------------- */

function renderHistory() {
  const container = document.getElementById('historyEvents');

  if (!container) return;

  const sorted = [...events].sort((a, b) =>
    new Date(eventTime(b)) - new Date(eventTime(a))
  );

  if (!sorted.length) {
    container.innerHTML = `
      <div class="empty-state">
        No events recorded yet.
      </div>
    `;

    return;
  }

  container.innerHTML = sorted.map(e => {
    let details;

    if (e.kind === 'timed') {
      details = e.end
        ? `${fmtDateTime(e.start)}–${fmtTime(e.end)} · ${durationText(durationMinutes(e.start, e.end))}`
        : `${fmtDateTime(e.start)} · Running`;
    } else {
      details = fmtDateTime(e.time);

      if (e.kind === 'quantity' && e.qty !== null) {
        details += ` · ${e.qty}`;
      }
    }

    return `
      <div class="event-row">
        <div class="event-icon">${e.icon}</div>

        <div class="event-main">
          <div class="event-name">${e.name}</div>

          <div class="event-details">
            ${details}
          </div>

          ${e.notes ? `
            <div class="event-notes">
              ${escapeHTML(e.notes)}
            </div>
          ` : ''}
        </div>

        <button
          class="edit-button"
          onclick="editEvent('${e.id}')"
        >
          Edit
        </button>
      </div>
    `;
  }).join('');
}

/* -------------------------------------------------------
   TRENDS
   ------------------------------------------------------- */

function renderTrends() {
  const container = document.getElementById('trendContent');

  if (!container) return;

  const now = new Date();
  const start = new Date(now);

  start.setDate(start.getDate() - 6);
  start.setHours(0, 0, 0, 0);

  const recent = events.filter(e =>
    new Date(eventTime(e)) >= start
  );

  const counts = {};

  cats.forEach(c => {
    counts[c.name] = 0;
  });

  recent.forEach(e => {
    if (counts[e.name] !== undefined) {
      counts[e.name]++;
    }
  });

  container.innerHTML = `
    <div class="trend-grid">
      ${cats.map(c => `
        <div class="trend-card">
          <div class="trend-icon">${c.icon}</div>
          <div class="trend-name">${c.name}</div>
          <div class="trend-number">${counts[c.name] || 0}</div>
          <div class="muted">last 7 days</div>
        </div>
      `).join('')}
    </div>
  `;
}

/* -------------------------------------------------------
   CATEGORY MANAGEMENT
   ------------------------------------------------------- */

function renderCategories() {
  const container = document.getElementById('categoryList');

  if (!container) return;

  container.innerHTML = cats.map(c => `
    <div class="category-row">
      <div>
        <strong>${c.icon} ${c.name}</strong>

        <div class="muted">
          ${kindLabel(c.kind)}
        </div>
      </div>

      ${
        builtins.some(b => b.name === c.name)
          ? ''
          : `
            <button
              class="danger small"
              onclick="deleteCategory('${escapeAttribute(c.name)}')"
            >
              Delete
            </button>
          `
      }
    </div>
  `).join('');
}

function addCategory() {
  const name = document.getElementById('newCategoryName')?.value.trim();
  const icon = document.getElementById('newCategoryIcon')?.value.trim() || '🐾';
  const kind = document.getElementById('newCategoryKind')?.value || 'instant';

  if (!name) {
    alert('Please enter a category name.');
    return;
  }

  if (cats.some(c => c.name.toLowerCase() === name.toLowerCase())) {
    alert('That category already exists.');
    return;
  }

  cats.push({
    name,
    icon,
    kind
  });

  save();

  const nameInput = document.getElementById('newCategoryName');
  const iconInput = document.getElementById('newCategoryIcon');

  if (nameInput) nameInput.value = '';
  if (iconInput) iconInput.value = '';

  renderAll();
}

function deleteCategory(name) {
  if (builtins.some(b => b.name === name)) {
    return;
  }

  if (!confirm(`Delete the ${name} category? Existing events will remain.`)) {
    return;
  }

  cats = cats.filter(c => c.name !== name);

  save();
  renderAll();
}

/* -------------------------------------------------------
   EXPORT
   ------------------------------------------------------- */

function exportData() {
  const rows = events.map(e => ({
    id: e.id,
    category: e.name,
    type: e.kind === 'timed'
      ? 'Timed event'
      : 'One-time event',
    time: e.kind === 'timed' ? '' : e.time,
    start: e.kind === 'timed' ? e.start : '',
    end: e.kind === 'timed' ? (e.end || '') : '',
    duration_minutes: e.kind === 'timed' && e.end
      ? durationMinutes(e.start, e.end)
      : '',
    quantity: e.qty ?? '',
    notes: e.notes || ''
  }));

  const csv = [
    Object.keys(rows[0] || {
      id: '',
      category: '',
      type: '',
      time: '',
      start: '',
      end: '',
      duration_minutes: '',
      quantity: '',
      notes: ''
    }).join(','),

    ...rows.map(row =>
      Object.values(row)
        .map(value => csvEscape(value))
        .join(',')
    )
  ].join('\n');

  const blob = new Blob([csv], {
    type: 'text/csv;charset=utf-8;'
  });

  const url = URL.createObjectURL(blob);

  const a = document.createElement('a');

  a.href = url;
  a.download = `puppy-tracker-${new Date().toISOString().slice(0,10)}.csv`;

  document.body.appendChild(a);
  a.click();
  a.remove();

  URL.revokeObjectURL(url);
}

function csvEscape(value) {
  const text = String(value ?? '');

  if (
    text.includes(',') ||
    text.includes('"') ||
    text.includes('\n')
  ) {
    return '"' + text.replace(/"/g, '""') + '"';
  }

  return text;
}

/* -------------------------------------------------------
   SETTINGS
   ------------------------------------------------------- */

function saveSettings() {
  const puppyName = document.getElementById('puppyName')?.value.trim();

  if (puppyName) {
    settings.puppyName = puppyName;
  }

  save();
}

function loadSettingsUI() {
  const input = document.getElementById('puppyName');

  if (input) {
    input.value = settings.puppyName || '';
  }
}

/* -------------------------------------------------------
   HTML SAFETY
   ------------------------------------------------------- */

function escapeHTML(value) {
  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function escapeAttribute(value) {
  return escapeHTML(value);
}

/* -------------------------------------------------------
   RENDER EVERYTHING
   ------------------------------------------------------- */

function renderAll() {
  renderQuick();
  renderRunning();
  renderToday();
  renderHistory();
  renderTrends();
  renderCategories();
  loadSettingsUI();
}

/* -------------------------------------------------------
   INITIALIZE
   ------------------------------------------------------- */

document.addEventListener('DOMContentLoaded', () => {
  renderAll();
});
</script>
</body>
